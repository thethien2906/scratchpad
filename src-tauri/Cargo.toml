[package]
name = "erwining"
version = "2.0.0"
description = "Minimalist Scratchpad & Project Management App"
authors = ["erwining"]
edition = "2021"

[lib]
name = "erwining_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
